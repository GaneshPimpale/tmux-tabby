# Enable mouse so tabby's sidebar is clickable
set -g mouse on

# Number windows from 1 so a new window is appended at the end instead of
# filling the empty slot 0 at the top. tabby reads this and sets base-index
# and pane-base-index to 1 when it loads.
set -g @tabby_base_index 1

# Session persistence: resurrect saves windows/panes/paths/programs
# (prefix + Ctrl-s / prefix + Ctrl-r); continuum saves every 15 minutes and
# restores the last save when the tmux server starts. Both must load BEFORE
# tabby, which hooks into resurrect to strip and rebuild its own panes.
# resurrect's default list plus the extras; setting the option replaces the
# list rather than extending it.
set -g @resurrect-processes 'vi vim view nvim emacs man less more tail top htop irssi weechat mutt btop lazygit'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux

# tabby: vertical tab manager (https://github.com/brendandebeasi/tabby)
run-shell ~/.tmux/plugins/tabby/tabby.tmux
